<style>
/* 레이아웃: 세로 한 열, 성장 줄(층·전투력·골드·레벨) → 전장(카메라+미니맵+배너) → 영웅 카드 → 조작 → 전술/장비/기록 탭. 그레이박스 = 회색 도형, 역할색·등급색·골드만 색으로 씀 */
:root {
  --bg: #e9ebee; --panel: #f6f7f9; --line: #c9cdd3; --ink: #1d2128; --muted: #5d6470;
  --floor: #dfe2e6; --grid: #cdd1d7; --wall: #8e949e; --void: #3a3f47; --unit: #8b919b; --enemy: #6c727c; --boss: #4a4f58;
  --tape: #d9a300; --tapeInk: #1d2128;
  --tank: #3f6fb0; --healer: #2f9461; --mage: #7c58c4; --rogue: #c7742a; --champ: #2f63d6;
  --hurt: #c2413a; --dmg: #1d2128; --heal: #2f9461; --good: #2f9461; --shadow: #5b3d8a; --poison: #6c9a22; --eheal: #8a5a2b;
  --r0: #4a4f58; --r1: #2f63d6; --r2: #a87c00; --r3: #b4561c; --gold: #9a6f00; --crit: #c98a00;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16191e; --panel: #1f232a; --line: #343a44; --ink: #e6e8ec; --muted: #9aa1ad;
  --floor: #2a2e35; --grid: #33383f; --wall: #4a505a; --void: #111317; --unit: #9aa0aa; --enemy: #7c838e; --boss: #b3b8c0;
  --tape: #f0bb1e; --tapeInk: #16191e;
  --tank: #6f9be0; --healer: #4fc188; --mage: #a586ea; --rogue: #eb9a50; --champ: #6c9bff;
  --hurt: #f06a62; --dmg: #e6e8ec; --heal: #4fc188; --good: #4fc188; --shadow: #a37ee0; --poison: #a3cf4a; --eheal: #d39a5f;
  --r0: #d7dade; --r1: #7aa2ff; --r2: #f2cf3a; --r3: #e8a15a; --gold: #f2c94c; --crit: #ffd23f;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16191e; --panel: #1f232a; --line: #343a44; --ink: #e6e8ec; --muted: #9aa1ad;
  --floor: #2a2e35; --grid: #33383f; --wall: #4a505a; --void: #111317; --unit: #9aa0aa; --enemy: #7c838e; --boss: #b3b8c0;
  --tape: #f0bb1e; --tapeInk: #16191e;
  --tank: #6f9be0; --healer: #4fc188; --mage: #a586ea; --rogue: #eb9a50; --champ: #6c9bff;
  --hurt: #f06a62; --dmg: #e6e8ec; --heal: #4fc188; --good: #4fc188; --shadow: #a37ee0; --poison: #a3cf4a; --eheal: #d39a5f;
  --r0: #d7dade; --r1: #7aa2ff; --r2: #f2cf3a; --r3: #e8a15a; --gold: #f2c94c; --crit: #ffd23f;
  color-scheme: dark }

[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 14px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 460px; margin: 0 auto; padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 12px; }
.title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
h1 { white-space: nowrap; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.hud { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; gap: 2px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hud b { color: var(--ink); font-weight: 500; }

.stage { position: relative; width: 100%; aspect-ratio: 360 / 520; max-width: 100%; border: 1px solid var(--line); background: var(--void); overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 12px; padding: 22px;
  background: color-mix(in srgb, var(--bg) 96%, transparent); overflow-y: auto; }
.overlay h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; }
.overlay p { margin: 0; line-height: 1.55; color: var(--muted); max-width: 34em; }
.overlay p b { color: var(--ink); }
.overlay .stat { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.6; }
.meter { display: flex; flex-direction: column; gap: 4px; }
.meter .track { height: 8px; background: var(--line); position: relative; }
.meter .track i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
.meter .track u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tape); }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .lbl b { color: var(--ink); }
.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tips li { padding: 8px 10px; border-left: 4px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 3px; }
.tips li.bad { border-left-color: var(--hurt); } .tips li.warn { border-left-color: var(--tape); } .tips li.good, .tips li.info { border-left-color: var(--good); }
.tips b { font-weight: 700; font-size: 13.5px; } .tips span { font-size: 13px; color: var(--muted); line-height: 1.45; }
.loot { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.r0 { color: var(--r0); } .r1 { color: var(--r1); } .r2 { color: var(--r2); } .r3 { color: var(--r3); }

button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--tape); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 9px 14px; font-weight: 500; }
.btn.primary { background: var(--tape); color: var(--tapeInk); border-color: var(--tape); font-weight: 700; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.party { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.hero { border: 1px solid var(--line); background: var(--panel); padding: 7px 6px 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--rc); }
.hero.dead { opacity: .45; }
.hname { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; font-weight: 700; gap: 4px; }
.hname small { font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; }
.bar.hp i { background: var(--ink); } .bar.mp i { background: var(--rc); } .bar.mp.none { visibility: hidden; }
.skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
.sk { position: relative; border: 1px solid var(--line); background: var(--bg); font-size: 9.5px; font-weight: 700; text-align: center; padding: 3px 0; overflow: hidden; white-space: nowrap; }
.sk i { position: absolute; inset: auto 0 0 0; background: color-mix(in srgb, var(--ink) 30%, transparent); }
.sk span { position: relative; }
.sk.off { opacity: .35; text-decoration: line-through; }
.sk.fired { border-color: var(--rc); background: color-mix(in srgb, var(--rc) 25%, var(--bg)); }
.cast { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; }
.ult { border: 1px dashed var(--line); background: transparent; padding: 5px 2px; font-size: 11px; font-weight: 700; position: relative; overflow: hidden; }
.ult .fill { position: absolute; inset: auto 0 0 0; background: color-mix(in srgb, var(--rc) 22%, transparent); }
.ult span { position: relative; }
.ult.ready { border-style: solid; border-color: var(--rc); background: var(--rc); color: var(--panel); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.15); } }
@media (prefers-reduced-motion: reduce) { .ult.ready { animation: none; } }

.controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.controls .spacer { flex: 1; }
.seg { display: flex; }
.seg .btn { padding: 9px 10px; font-size: 12.5px; }
.seg .btn + .btn { border-left: 0; }
.seg.speed .btn { font-family: var(--font-mono); }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--tape); }
section { padding-top: 10px; }

#log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 12.5px; max-height: 240px; overflow-y: auto; }
#log li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
#log time { font-family: var(--font-mono); font-size: 11px; color: var(--muted); min-width: 38px; font-variant-numeric: tabular-nums; }
#log .death { color: var(--hurt); font-weight: 700; } #log .warn { color: var(--tape); font-weight: 700; }
#log .good { color: var(--good); } #log .room { font-weight: 700; } #log .ult { color: var(--mage); font-weight: 700; } #log .muted { color: var(--muted); }
#log .loot0 { color: var(--r0); font-weight: 700; } #log .loot1 { color: var(--r1); font-weight: 700; } #log .loot2 { color: var(--r2); font-weight: 700; } #log .loot3 { color: var(--r3); font-weight: 700; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; font-size: 13px; font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--rc); box-shadow: inset 0 -3px 0 var(--rc); }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 8px 0; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; font-size: 13px; }
.opts label { display: flex; gap: 6px; align-items: center; }
select { border: 1px solid var(--line); background: var(--panel); padding: 6px 8px; font-size: 12.5px; max-width: 100%; min-width: 0; }
.pill { border: 1px solid var(--line); background: var(--panel); padding: 6px 10px; font-size: 12.5px; font-weight: 700; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rule { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px; background: var(--panel); border: 1px solid var(--line); }
.rule.off { opacity: .55; }
.rule .n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: center; padding-top: 2px; }
.rule .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 13px; }
.rule .txt b { font-weight: 700; } .rule .txt em { font-style: normal; color: var(--muted); font-size: 11.5px; }
.rule select { width: 100%; }
.rule .ctl { display: flex; gap: 4px; }
.rule .ctl button { border: 1px solid var(--line); background: var(--bg); width: 30px; height: 30px; font-size: 13px; padding: 0; }
.rule .ctl .tog { width: 44px; font-size: 11.5px; font-weight: 700; }
.rule .ctl .tog[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.gearsum { display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 8px; }
.gearlist { display: flex; flex-direction: column; gap: 6px; }
.gh { border: 1px solid var(--line); background: var(--panel); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.gh::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--rc); }
.gh h3 { margin: 0; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.gh h3 small { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-size: 11px; }
.slot { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; font-size: 12.5px; align-items: baseline; }
.slot > span:first-child { color: var(--muted); font-size: 11.5px; }
.slot b { font-weight: 700; } .slot em { font-style: normal; color: var(--muted); font-size: 11.5px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 10px; height: 10px; background: var(--enemy); }
.legend i.c { border-radius: 50%; background: var(--unit); } .legend i.ch { outline: 2px solid var(--champ); } .legend i.p { background: var(--hurt); opacity: .5; border-radius: 50%; }

.overlay > :first-child { margin-top: auto; } .overlay > :last-child { margin-bottom: auto; }
/* ---- 성장 줄 ---- */
.strip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.floorSel { display: flex; align-items: stretch; border: 1px solid var(--line); background: var(--panel); }
.floorSel button { border: 0; background: none; width: 30px; font-size: 13px; padding: 0; }
.floorSel button:disabled { opacity: .3; }
.floorSel .f { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2px 2px; min-width: 50px; }
.floorSel button { width: 24px; }
.floorSel .f b { font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1; }
.floorSel .f small { font-size: 10px; color: var(--muted); }
.cpbox { border: 1px solid var(--line); background: var(--panel); padding: 5px 9px; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; position: relative; }
.cpbox .top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.cpbox .lbl { font-size: 10.5px; color: var(--muted); font-weight: 700; }
.cpbox .num { font-family: var(--font-mono); font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cpbox .rec { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cpbox .rec b { font-weight: 700; }
.cpbox .rec b.ok { color: var(--good); } .cpbox .rec b.mid { color: var(--tape); } .cpbox .rec b.bad { color: var(--hurt); }
.cptoast { position: absolute; right: 8px; top: 5px; font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--good); pointer-events: none; opacity: 0; }
.cptoast.show { animation: rise 1.4s ease-out; }
@keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
.wallet { border: 1px solid var(--line); background: var(--panel); padding: 5px 9px; display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 76px; }
.wallet .g { font-family: var(--font-mono); font-size: 13px; color: var(--gold); font-weight: 500; font-variant-numeric: tabular-nums; }
.wallet .lv { font-size: 11px; font-weight: 700; display: flex; justify-content: space-between; gap: 4px; }
.xpbar { height: 3px; background: var(--line); position: relative; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: var(--tape); }

/* ---- 배너 (전장 위) ---- */
.banner { position: absolute; left: 0; right: 0; top: 34%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 16px;
  background: color-mix(in srgb, var(--void) 82%, transparent); color: #fff; pointer-events: none; text-align: center;
  border-top: 2px solid var(--bc); border-bottom: 2px solid var(--bc); }
.banner b { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--bc); letter-spacing: .02em; }
.banner span { font-size: 12.5px; color: #e6e8ec; }
.banner.in { animation: bannerIn 1.9s ease-out forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scaleY(.2); } 12% { opacity: 1; transform: scaleY(1.06); } 20% { transform: scaleY(1); } 82% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .banner.in { animation-duration: 2.4s; } .cptoast.show { animation: none; opacity: 1; } }

.pill.auto[aria-pressed="true"] { background: var(--tape); color: var(--tapeInk); border-color: var(--tape); }
.status { display: inline-block; padding: 2px 8px; font-size: 11.5px; font-weight: 700; border: 1px solid currentColor; }
.status.ok { color: var(--good); } .status.mid { color: var(--tape); } .status.bad { color: var(--hurt); }
.rewards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rewards div { background: var(--panel); border: 1px solid var(--line); padding: 7px 6px; display: flex; flex-direction: column; gap: 2px; align-items: center; }
.rewards b { font-family: var(--font-mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.rewards span { font-size: 11px; color: var(--muted); }
.rewards .gold b { color: var(--gold); }
.slot { grid-template-columns: 46px minmax(0, 1fr) auto; }
.enh { border: 1px solid var(--line); background: var(--bg); padding: 4px 7px; font-size: 11.5px; font-weight: 700; white-space: nowrap; display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.enh small { font-family: var(--font-mono); font-weight: 500; color: var(--gold); font-size: 10.5px; }
.enh:disabled { opacity: .45; }
.enh.can { border-color: var(--gold); }
.lvtag { font-family: var(--font-mono); font-size: 10.5px; color: var(--gold); font-weight: 500; }

/* ---- 한 화면 게임 레이아웃: 성장 줄 / 전장 / 파티 바 / 조작 줄이 세로 한 화면에 모두 보임 ---- */
.game { max-width: 460px; margin: 0 auto; box-sizing: border-box;
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 520px; max-height: 960px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 6px; }
.game .strip { flex: none; }
.game .stage { flex: 1 1 auto; min-height: 0; aspect-ratio: auto; }
.game .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.strip .floorSel .f b { font-size: 17px; }
.cpbox, .wallet { padding: 3px 8px; }
.cpbox .num { font-size: 16px; }
.wrap.below { padding-block: 4px 28px; }
.party { flex: none; gap: 4px; }
.hero { padding: 5px 4px 4px; gap: 3px; }
.hname { align-items: center; gap: 3px; font-size: 11.5px; }
.hname canvas { width: 26px; height: 26px; flex: none; margin: -3px 0 -3px -1px; }
.hname .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
.hname small { font-size: 10px; }

const SKILLS = {

    { id: 'taunt', name: '도발', abbr: '도발', cd: 8, desc: '대상의 공격을 나에게 돌림',

    { id: 'dispel', name: '정화', abbr: '정화', cd: 4, desc: '독 제거 · 마나 40',

const TARGETS = [['tank', '탱커의 대상'], ['weak', '체력 낮은 적'], ['caster', '시전형 적 우선']];

function defaultConfig() {
  const c = {};
  for (const r of ROLE_ORDER) c[r] = {
    order: SKILLS[r].map(s => s.id), on: {}, cond: {}, target: 'tank', dodge: true,

const BAG_MAX = 60;
const RARITY = [
  { id: 'normal', name: '일반' },
  { id: 'magic',  name: '마법' },
  { id: 'rare',   name: '희귀' },
  { id: 'unique', name: '고유' },

// ---------- 보상 ----------
function reward(S, e) {

// ---------- 전리품 ----------
function dropLoot(S, e) {

    if (r.sold) log(S, `가방이 가득 차서 ${r.sold.name} 판매 (+${r.gold}G)`, 'muted');
    if (r.sold !== it) {
      S.stats.bagged++;
      log(S, `[${RARITY[it.rar].name}] ${it.name} 획득${up ? ' ▲ ' + h.name + ' 장비보다 좋음' : ''}`, up ? 'loot' + it.rar : 'muted');

// ---------- 영웅 AI ----------
function heroTick(S, h) {
  for (const k in h.cds) if (h.cds[k] > 0) h.cds[k] -= DT;
  for (const k in h.buffs) if (h.buffs[k] > 0) h.buffs[k] -= DT;
  if (h.maxMana) { h.mana = Math.min(h.maxMana, h.mana + h.regen * (h.regenMul || 1) * DT * (S.inCombat ? 1 : 6)); if (h.role === 'healer' && S.inCombat && h.mana < h.maxMana * 0.05) S.stats.oom += DT; }
  if (!S.inCombat) { h.hp = Math.min(h.maxHp, h.hp + h.maxHp * 0.06 * DT); h.poison = 0; }
  if (S.inCombat && h.hpRegen > 0) h.hp = Math.min(h.maxHp, h.hp + h.maxHp * h.hpRegen * DT);
  if (h.poison > 0) { h.poison -= DT; damage(S, null, h, (h.poisonDps || 24) * (1 - (h.poisonRes || 0)) * DT, 'poison'); if (!h.alive) return; }
  if (S.inCombat && h.ult < 100) h.ult = Math.min(100, h.ult + DT * 100 / 30);
}

function heroCombat(S, h) {
  if (h.moveTo) { h.moveT = (h.moveT || 0) + DT; if (goTo(S, h, h.moveTo.x, h.moveTo.y, 3) || h.moveT > 2) { h.moveTo = null; h.moveT = 0; } return; }
  if (h.casting) { h.casting.t -= DT; if (h.casting.t <= 0) { const c = h.casting; h.casting = null; c.onDone(); h.gcd = 0.25; } return; }
  if (h.gcd > 0) h.gcd -= DT;

  if (C.dodge && h.role !== 'mage' && moveOutOfPool(S, h)) return;
  if (C.dodge && h.role === 'mage' && moveOutOfPool(S, h, false)) return;

  // 대상
  const es = activeE(S); if (!es.length) return;
  if (h.role === 'tank') {
    h.retarget = (h.retarget || 0) - DT;

      const loose = es.filter(e => e.target && e.target !== h && !e.castKind);
      h.target = nearest(loose, h) || es.find(e => e.boss) || nearest(es.filter(e => !e.castKind), h) || nearest(es, h); h.retarget = 2.5;
    }
  } else if (!h.target || !h.target.alive || !h.target.active || h.role !== 'healer') {
    h.target = pickTarget(S, h);

  if (h.gcd <= 0) {

    const bad = S.pools.find(p => Math.hypot(t.x - p.x, t.y - p.y) < p.r + t.r + 20);
    if (bad) { const a = Math.atan2(t.y - bad.y, t.x - bad.x); ax = t.x + Math.cos(a) * (t.r + 14); ay = t.y + Math.sin(a) * (t.r + 14); }
    if (C.dodge && !inPool(S, h)) {
      const nx = h.x + Math.sign(ax - h.x) * 3, ny = h.y + Math.sign(ay - h.y) * 3;
      if (S.pools.some(p => p.warn <= 0 && Math.hypot(nx - p.x, ny - p.y) < p.r + h.r * 0.5)) return;
    }
    if (goTo(S, h, ax, ay, reach - 4)) {
      h.atkT -= DT * h.haste * (h.buffs.storm > 0 ? 3 : 1);
      if (h.atkT <= 0) {
        h.atkT = h.atkRate;
        if (h.buffs.storm > 0) es.filter(e => dist(e, h) < 65).forEach(e => damage(S, h, e, h.atk, 'hit'));
        else damage(S, h, t, h.atk, 'hit');

    if (dist(h, anchor) > range || !los(S, h.x, h.y, anchor.x, anchor.y)) { goTo(S, h, anchor.x, anchor.y, range * 0.7); return; }
    if (h.role === 'healer' && h.mana < h.maxMana * 0.5) return;

// 탐험: 리더(전사)가 목표로 가고 나머지는 따라감
function chooseGoal(S, leader) {
  // 1) 떨어진 장비
  const ds = S.drops.filter(d => isSeen(S, d.x, d.y));
  if (ds.length) { const d = nearest(ds, leader); return { x: d.x, y: d.y, kind: 'loot' }; }
  // 2) 보이는 몹 무리
  const b = boss(S);
  const packs = S.packs.filter(p => S.enemies.some(e => e.pack === p.id && e.alive) && isSeen(S, p.x, p.y) && (S.mode === 'hunt' || p.boss));
  const nonBoss = packs.filter(p => !p.boss);
  if (S.mode === 'hunt' && nonBoss.length) { const p = nearest(nonBoss, leader); return { x: p.x, y: p.y, kind: 'pack' }; }
  // 3) 사냥 모드: 아직 못 본 곳 탐험 / 보스 직행: 보스방이 보이면 보스로
  const bossSeen = b && b.alive && isSeen(S, b.x, b.y);
  const allPacksDead = !S.packs.some(p => !p.boss && S.enemies.some(e => e.pack === p.id && e.alive));
  if (bossSeen && (S.mode === 'rush' || allPacksDead)) return { x: b.x, y: b.y, kind: 'boss' };
  const f = frontier(S, leader);
  if (f) return { x: f.x, y: f.y, kind: 'explore' };
  if (b && b.alive) return { x: b.x, y: b.y, kind: 'boss' };
  return null;
}
function frontier(S, from) {
  const g = S.map.g, si = Math.floor(from.x / TILE), sj = Math.floor(from.y / TILE);
  const seenQ = new Uint8Array(MW * MH), q = [sj * MW + si]; seenQ[q[0]] = 1;

  // 보스 직행: 보스방 방향 우선(거리 가중 대신 단순 BFS, 보스방 쪽 미확인 칸을 우선 선택)
  let firstAny = null;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi];
    if (!S.seen[c]) {
      if (S.mode !== 'rush') return { x: tc(c % MW), y: tc((c / MW) | 0) };
      if (!firstAny) firstAny = c;
    }
    const x = c % MW, y = (c / MW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || !g[ny][nx]) continue;
      if (avoidBoss && nx >= br.x - 1 && nx < br.x + br.w + 1 && ny >= br.y - 1 && ny < br.y + br.h + 1) continue;
      const n = ny * MW + nx; if (!seenQ[n]) { seenQ[n] = 1; q.push(n); }
    }
  }
  if (S.mode === 'rush' && firstAny != null) {
    // 보스방에 가장 가까운 미확인 경계 칸
    const bx = S.map.boss.cx, by = S.map.boss.cy; let best = null;
    for (const c of q) if (!S.seen[c]) { const d = Math.abs(c % MW - bx) + Math.abs(((c / MW) | 0) - by); if (!best || d < best[1]) best = [c, d]; }
    // 경계 칸만 (본 칸과 인접)
    return best ? { x: tc(best[0] % MW), y: tc((best[0] / MW) | 0) } : null;
  }
  return null;
}
function heroExplore(S, h, leader, idx) {
  h.casting = null; h.moveTo = null;
  if (h === leader) {

    if (!S.goal || S.goalT <= 0 || (S.goal.kind === 'explore' && isSeen(S, S.goal.x, S.goal.y) && Math.random() < 0.3)) { S.goal = chooseGoal(S, h); S.goalT = 1; }
    if (S.goal) { if (goTo(S, h, S.goal.x, S.goal.y, S.goal.kind === 'pack' || S.goal.kind === 'boss' ? 40 : 4)) S.goalT = 0; }
  } else {
    const off = [[0, 0], [-22, 28], [22, 28], [0, 46]][idx];

    const tx = blocked(S, lx, ly, h.r) ? leader.x : lx, ty = blocked(S, lx, ly, h.r) ? leader.y : ly;

}

// ---------- 적 AI ----------
function enemyTick(S, e) {
  const hs = aliveH(S); if (!hs.length) return;
  if (!e.active) {
    if (S.t % 0.25 < DT) for (const h of hs) if (dist(h, e) < (e.boss ? 130 : 210) && los(S, h.x, h.y, e.x, e.y)) { activatePack(S, e.pack); break; }
    return;
  }
  if (e.slow > 0) e.slow -= DT; if (e.root > 0) e.root -= DT; if (e.taunted > 0) e.taunted -= DT;
  if (!(e.taunted > 0)) {
    let best = null, bv = -1;
    for (const h of hs) { if (h.buffs.evade > 0) continue; const v = e.threat[h.id] || 0; if (v > bv) { bv = v; best = h; } }
    if (bv <= 0) best = nearest(hs, e);
    e.target = best;
  }
  if (!e.target || !e.target.alive) e.target = nearest(hs, e);
  if (e.boss) bossMechanics(S, e);
  if (!e.alive) return;
  if (e.casting) { e.casting.t -= DT; if (e.casting.t <= 0) { const c = e.casting; e.casting = null; c.onDone(); } return; }
  const t = e.target; if (!t) return;
  const canMove = !(e.root > 0);
  const mult = (e.enraged ? 3 : 1) * (e.boss || e.key === 'add' ? S.bossMult(e) : 1);
  if (e.castKind) {
    if (dist(e, t) > e.range || !los(S, e.x, e.y, t.x, t.y)) { if (canMove) goTo(S, e, t.x, t.y, e.range - 20); return; }
    e.atkT -= DT;
    if (e.atkT > 0) return;
    e.atkT = e.atkRate;
    if (e.castKind === 'bolt') e.casting = { name: '그림자 화살', t: 2, total: 2, interruptible: true, onDone: () => {
      const tg = e.target && e.target.alive ? e.target : nearest(aliveH(S), e); if (!tg) return;
      damage(S, e, tg, 150 * S.fs * (e.champ ? 1.3 : 1), 'bolt'); S.stats.missed['그림자 화살'] = (S.stats.missed['그림자 화살'] || 0) + 1;
      fx(S, { type: 'bolt', x: e.x, y: e.y, x2: tg.x, y2: tg.y, color: 'shadow', life: 0.3 }); } };
    else if (e.castKind === 'mend') e.casting = { name: '부패한 치유', t: 2.5, total: 2.5, interruptible: true, onDone: () => {
      const tg = activeE(S).sort((a, b) => pct(a) - pct(b))[0]; if (!tg) return;
      tg.hp = Math.min(tg.maxHp, tg.hp + 340 * S.fs); S.stats.menderHeals++; S.stats.missed['부패한 치유'] = (S.stats.missed['부패한 치유'] || 0) + 1;
      fx(S, { type: 'num', x: tg.x, y: tg.y - tg.r - 10, text: '+' + Math.round(340 * S.fs), color: 'eheal', life: 0.9 }); } };
    else { const tg = pick(hs); damage(S, e, tg, e.atk, 'hit'); tg.poison = 10; tg.poisonDps = 24 * S.fs; fx(S, { type: 'bolt', x: e.x, y: e.y, x2: tg.x, y2: tg.y, color: 'poison', life: 0.3 }); }
    return;
  }
  const arrived = canMove ? goTo(S, e, t.x, t.y, e.range + t.r - 4) : dist(e, t) <= e.range + t.r;
  if (arrived) { e.atkT -= DT; if (e.atkT <= 0) { e.atkT = e.atkRate; damage(S, e, t, e.atk * mult, 'hit'); } }
}

function bossMechanics(S, b) {
  const T = b.timers, M = S.bossMult(b);
  b.engageT += DT;
  for (const k in T) T[k] -= DT;
  if (b.strikeWarn > 0) b.strikeWarn -= DT;
  if (!b.enraged && b.engageT > 150) { b.enraged = true; S.stats.enraged = true; log(S, '고르바크가 광폭화합니다!', 'death'); }
  if (!b.addsDone && pct(b) < 0.5) {
    b.addsDone = true;
    for (const a of [-1, 1]) { let x = b.x + a * 110, y = b.y - 60; if (blocked(S, x, y, 12)) { x = b.x; y = b.y; } const m = makeMob('add', x, y, false, b.pack, S.fs); m.active = true; S.enemies.push(m); }
    log(S, '고르바크: 돌 정령 2마리 소환', 'warn');
  }
  if (T.strike <= 2 && T.strike > 0 && !(b.strikeWarn > 0)) { b.strikeWarn = 2; log(S, '고르바크가 「대지 강타」를 준비합니다', 'warn'); }
  if (T.strike <= 0) {
    T.strike = 14; const t = b.target;
    if (t && t.alive) { S.stats.busterHits++; if (!(t.buffs.wall > 0)) S.stats.busterRaw++; damage(S, b, t, 950 * M, 'strike'); S.ev.push({ t: 'shake', m: 7 }); fx(S, { type: 'ring', x: t.x, y: t.y, r: 30, color: 'boss', life: 0.5 }); }
  }
  if (T.pool <= 0) {
    T.pool = 8; const hs = aliveH(S).filter(h => h.role !== 'tank'); const tg = pick(hs.length ? hs : aliveH(S));
    if (tg) S.pools.push({ x: tg.x, y: tg.y, r: 42, t: 9, warn: 1 });
  }

      S.stats.explosions++; log(S, '「암흑 폭발」이 터졌습니다!', 'death');
      aliveH(S).forEach(h => damage(S, b, h, 360 * M, 'blast')); S.ev.push({ t: 'shake', m: 11 });
      fx(S, { type: 'ring', x: b.x, y: b.y, r: 260, color: 'shadow', life: 0.7 }); } };

}

// ---------- 궁극기 ----------
function useUlt(S, role) {
  const h = S.heroes.find(x => x.role === role);
  if (!h || !h.alive || h.ult < 100 || !S.inCombat || S.phase !== 'explore') return false;
  h.ult = 0; S.stats.ultsUsed++;
  if (role === 'tank') { S.partyDR = 5; fx(S, { type: 'ring', x: h.x, y: h.y, r: 200, color: 'tank', life: 0.8 }); }
  if (role === 'healer') { aliveH(S).forEach(x => heal(S, h, x, 450)); fx(S, { type: 'ring', x: h.x, y: h.y, r: 220, color: 'heal', life: 0.8 }); }
  if (role === 'mage') activeE(S).forEach(e => { damage(S, h, e, 600, 'ult'); fx(S, { type: 'ring', x: e.x, y: e.y, r: 34, color: 'mage', life: 0.6 }); });
  if (role === 'rogue') h.buffs.storm = 6;
  fx(S, { type: 'sk', id: 'ult', role, x: h.x, y: h.y, life: 1.1 });
  S.ev.push({ t: 'ult', role, name: ULTS[role].name });
  log(S, `${h.name}: ${ULTS[role].name}!`, 'ult');
  return true;
}

// ---------- 메인 스텝 ----------
function step(S) {
  if (S.phase === 'win' || S.phase === 'lose') return;
  S.t += DT;
    if (S.partyDR > 0) S.partyDR -= DT;
  const wasCombat = S.inCombat;
  S.inCombat = activeE(S).length > 0;
  if (wasCombat && !S.inCombat) {
    S.pools = []; S.zones = [];
    for (const h of S.heroes) { h.casting = null; h.moveTo = null; if (!h.alive) { h.alive = true; h.hp = h.maxHp * 0.3; log(S, `${h.name} 부활 (전투 종료)`, 'room'); } }
  }

  for (const p of S.pools) {
    if (p.warn > 0) { p.warn -= DT; continue; }
    p.t -= DT;
    for (const h of aliveH(S)) if (Math.hypot(h.x - p.x, h.y - p.y) < p.r + h.r * 0.5) damage(S, null, h, 120 * S.bossMult() * DT, 'pool');
  }
  S.pools = S.pools.filter(p => p.t > 0);
  for (const z of S.zones) { z.t -= DT; for (const e of activeE(S)) if (Math.hypot(e.x - z.x, e.y - z.y) < z.r) { damage(S, z.src, e, 55 * DT, 'tick'); e.slow = 0.5; } }
  S.zones = S.zones.filter(z => z.t > 0);

  if (S.autoUlt && S.inCombat) {
    const bb = boss(S);
    if ((bb && bb.active && bb.alive) || activeE(S).length >= 4) for (const r of ROLE_ORDER) useUlt(S, r);
  }
  const hs = aliveH(S);
  const leader = tankOf(S) || hs[0];
  for (const h of S.heroes) {
    if (!h.alive) continue;
    heroTick(S, h); if (!h.alive) continue;
    if (S.inCombat) heroCombat(S, h);
    else heroExplore(S, h, leader, S.heroes.indexOf(h));
  }
  for (const e of S.enemies) if (e.alive) enemyTick(S, e);

  // 줍기
  for (const d of S.drops) { d.t += DT; if (!S.inCombat && (hs.some(h => dist(h, d) < 34) || d.t > 25)) { d.taken = true; pickUp(S, d); } }
  S.drops = S.drops.filter(d => !d.taken);

  // 겹침 방지
  const all = [...aliveH(S), ...S.enemies.filter(e => e.alive && e.active)];
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j]; if (a.team === 'hero' && b.team === 'hero') continue; const d = dist(a, b), m = a.r + b.r;
    if (d > 0 && d < m) { const k = (m - d) / d / 2, dx = (b.x - a.x) * k, dy = (b.y - a.y) * k;
      if (!a.boss) slide(S, a, -dx, -dy); if (!b.boss) slide(S, b, dx, dy); }
  }
  if (S.t % 0.25 < DT) reveal(S);
  for (const e of S.enemies) if (e.flash > 0) e.flash -= DT;
  for (const f of S.fx) f.age += DT; S.fx = S.fx.filter(f => f.age < f.life);

  const b = boss(S);
  if (!aliveH(S).length) {
    S.phase = 'lose'; S.stats.bossHp = b && b.active ? pct(b) : null; S.result = analyze(S, false); log(S, '파티 전멸', 'death');
  } else if (b && !b.alive && !S.inCombat && !S.drops.length) {
    S.winT += DT; if (S.winT > 1) { S.phase = 'win'; S.P.maxFloor = Math.max(S.P.maxFloor, S.floor + 1); S.result = analyze(S, true); log(S, '던전 클리어!', 'good'); }
  }
}

// ---------- 결과 분석 ----------

  const pool = Object.entries(st.poolDmg).filter(([, v]) => v > 150).sort((a, b) => b[1] - a[1]);
  if (pool.length) tips.push({ sev: 'warn', title: `바닥 장판 피해: ${pool.map(([r, v]) => ROLE_INFO[r].name + ' ' + Math.round(v)).join(', ')}`, fix: '해당 영웅의 「장판 회피」를 켜세요. 마법사는 「점멸」 조건을 「장판 위」로 바꾸는 방법도 있습니다.' });

  if (st.oom > 10) tips.push({ sev: 'warn', title: `치유사 마나 바닥 ${Math.round(st.oom)}초`, fix: '「빠른 치유」 조건을 「50% 이하」로 바꾸거나 「치유의 비」 조건을 높여 마나를 아끼세요.' });
  if (st.enraged) tips.push({ sev: 'bad', title: '보스 광폭화 (150초 초과)', fix: '딜이 부족합니다. 무기 장비를 맞추고, 마법사·도적 궁극기를 보스에 쓰세요.' });

    for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) if (g[j][i] && S.seen[j * MW + i]) ctx.fillRect(mx + i * mm, my + j * mm, mm, mm);
    for (const p of S.packs) { if (!isSeen(S, p.x, p.y) || !S.enemies.some(e => e.pack === p.id && e.alive)) continue; ctx.fillStyle = p.boss ? C.tape : p.champ ? C.champ : C.hurt; const s = p.boss ? 5 : 3; ctx.fillRect(mx + p.x / TILE * mm - s / 2, my + p.y / TILE * mm - s / 2, s, s); }
    for (const d of S.drops) if (isSeen(S, d.x, d.y)) { ctx.fillStyle = C['r' + d.item.rar]; ctx.fillRect(mx + d.x / TILE * mm - 1, my + d.y / TILE * mm - 1, 2, 2); }
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1; ctx.strokeRect(mx + ox / TILE * mm, my + oy / TILE * mm, VW / TILE * mm, VH / TILE * mm);
    for (const h of hs) { ctx.fillStyle = C[h.role]; ctx.fillRect(mx + h.x / TILE * mm - 1.5, my + h.y / TILE * mm - 1.5, 3, 3); }

    // 보스 바 / 층 표시
    const b = S.enemies.find(e => e.boss);
    ctx.textBaseline = 'alphabetic';
    if (b && b.active && b.alive) {
      const bw = mx - 20;
      ctx.fillStyle = C.panel; ctx.fillRect(8, 8, bw, 22); ctx.fillStyle = C.hurt; ctx.fillRect(8, 8, bw * b.hp / b.maxHp, 22);
      ctx.strokeStyle = C.ink; ctx.strokeRect(8.5, 8.5, bw - 1, 21);
      ctx.fillStyle = C.ink; ctx.font = `700 10.5px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('고르바크' + (b.enraged ? ' · 광폭화' : ''), 13, 23);
      ctx.textAlign = 'right'; ctx.fillText(Math.round(b.hp / b.maxHp * 100) + '%', 8 + bw - 5, 23);
      ctx.textAlign = 'left'; ctx.fillStyle = C.bg; ctx.globalAlpha = .7; ctx.fillRect(8, 34, 92, 15); ctx.globalAlpha = 1;
      ctx.fillStyle = C.ink; ctx.font = `500 10px ${FONT}`; ctx.fillText('광폭화까지 ' + Math.max(0, Math.ceil(150 - b.engageT)) + '초', 12, 45);
    } else {
      const left = S.packs.filter(p => !p.boss && S.enemies.some(e => e.pack === p.id && e.alive)).length, tt = Math.floor(S.t);
      const st = S.phase === 'lose' ? '전멸' : S.phase === 'win' ? '클리어' : S.inCombat ? '전투 중' : '탐험 중';
      const txt = `${S.floor}층 · ${st} · 남은 무리 ${left} · ${Math.floor(tt / 60)}:${String(tt % 60).padStart(2, '0')}`;
      ctx.font = `700 10.5px ${FONT}`; const tw = ctx.measureText(txt).width;
      ctx.fillStyle = C.bg; ctx.globalAlpha = .8; ctx.fillRect(8, 8, tw + 12, 18); ctx.globalAlpha = 1;
      ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.fillText(txt, 14, 21);
    }
    if (ultFx) {
      const e = (performance.now() - ultFx.t0) / 1100;
      if (e >= 1) ultFx = null;
      else {
        ctx.save(); ctx.globalAlpha = 0.22 * (1 - e); ctx.fillStyle = C[ultFx.role]; ctx.fillRect(0, 0, VW, VH);
        ctx.globalAlpha = e < 0.8 ? 1 : (1 - e) * 5; const s = 1 + Math.max(0, 0.15 - e) * 3;
        ctx.font = `400 ${Math.round(28 * s)}px "Black Han Sans", ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = C.void; ctx.strokeText(ultFx.name, VW / 2, VH * 0.3); ctx.fillStyle = C[ultFx.role]; ctx.fillText(ultFx.name, VW / 2, VH * 0.3);
        ctx.font = `700 11px ${FONT}`; ctx.lineWidth = 3; const who = ROLE_INFO[ultFx.role].name + ' 궁극기'; ctx.strokeText(who, VW / 2, VH * 0.3 - 24); ctx.fillStyle = C.panel; ctx.fillText(who, VW / 2, VH * 0.3 - 24);
        ctx.restore();
      }
    }
  }

  let saveT = 0, portraitN = 0;
  function frame(ts) {
    const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
    if (running && S.phase !== 'win' && S.phase !== 'lose') { acc += dt * speed; let n = 0; while (acc >= DT && n++ < 200) { step(S); acc -= DT; } }
    consumeEvents();
    if ((saveT += dt) > 2 && S.t > 0) { saveT = 0; saveP(); }
    if ((S.phase === 'win' || S.phase === 'lose') && !seenResult) { seenResult = true; setRunning(false); saveP(); setTimeout(showResult, S.phase === 'win' ? 900 : 300); }
    draw(ts); updateCards(); updateLog(); updateStrip();
    if ((portraitN = (portraitN + 1) % 4) === 0) { drawPortraits(); drawInvPortrait(); }
    requestAnimationFrame(frame);
  }
  draw(0); updateCards(); updateStrip(); updateEqBadge();
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveP(); if (running) setRunning(false); } });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
